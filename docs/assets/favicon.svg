<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- The brand mark: the diazo-yellow glyph on the prussian sheet (DESIGN.md §8), the same
       on light and dark tabs. sRGB of mark and the default nav-bg, because an SVG used
       as an image cannot read custom properties. Same file as docs/assets/favicon.svg. -->
  <rect width="24" height="24" rx="3" fill="#14325d"/>
  <g stroke="#f4d660" transform="translate(2.4 2.4) scale(0.8)">
    <polyline points="4 17 10 11 4 5"/>
    <line x1="12" y1="19" x2="20" y2="19"/>
  </g>
</svg>
