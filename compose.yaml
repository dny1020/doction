# Local development compose; production lives on the Pi at /opt/doction, outside this repo.
# Before bringing it up: mkdir -p data/logs, so the bind mounts get your uid, which is the
# container's `doction` user (uid 1000, non-root).
services:
  postgres:
    image: postgres:16-alpine
    container_name: doction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doction}
      POSTGRES_DB: doction
    ports:
      # Loopback only: handy for a local psql, without exposing the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doction"]
      interval: 5s
      timeout: 5s
      retries: 5

  doction:
    image: ghcr.io/dny1020/doction:latest
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./data/logs:/logs
    environment:
      DATABASE_URL: postgresql://doction:${POSTGRES_PASSWORD:-doction}@postgres:5432/doction
      # Without SECRET_KEY the server boots on the dev key and says so in the log; set it
      # if this compose is used anywhere but localhost.
      SECRET_KEY: ${SECRET_KEY:-}
      # The rest is forwarded with the application's own defaults, so what .env.example
      # documents actually reaches the container: documenting a flag and not passing it
      # here is the silent way to make it do nothing.
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-0}
      SOURCE_URL: ${SOURCE_URL:-}
      SEMANTIC_SEARCH: ${SEMANTIC_SEARCH:-0}
      RERANK: ${RERANK:-0}
      OCR_UPLOADS: ${OCR_UPLOADS:-0}
      OCR_LANGS: ${OCR_LANGS:-eng+spa}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
