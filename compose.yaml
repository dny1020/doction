# Compose de desarrollo local. El de producción vive en la Pi (/opt/doction), fuera
# de este repo.
# Antes de levantar: mkdir -p data/logs  (así los bind mounts quedan con tu uid,
# que es el del usuario `doction` del contenedor — uid 1000, non-root).
services:
  postgres:
    image: postgres:16-alpine
    container_name: doction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doction}
      POSTGRES_DB: doction
    ports:
      # Solo loopback: útil para psql local, sin exponer la BD a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doction"]
      interval: 5s
      timeout: 5s
      retries: 5

  doction:
    image: ghcr.io/dny1020/doction:latest
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./data/logs:/logs
    environment:
      DATABASE_URL: postgresql://doction:${POSTGRES_PASSWORD:-doction}@postgres:5432/doction
      # Sin SECRET_KEY el server arranca con la clave de dev (y lo avisa en el log);
      # exportarla o ponerla en .env si este compose se usa fuera de localhost.
      SECRET_KEY: ${SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
