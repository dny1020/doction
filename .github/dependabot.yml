version: 2

# Monthly, one grouped PR per ecosystem, minor and patch only: a personal project cannot
# triage a PR a day. Major upgrades are migrations, done by hand when wanted. Security
# updates are not governed by this file and still arrive as soon as an advisory lands.
updates:
  # `uv`, because the lockfile is uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies, python]

  # package.json lives in frontend/. One group, so peer families (react, eslint, vite) always
  # move together and never fail `npm ci` with ERESOLVE.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies, frontend]

  # Dockerfile base images: digest refreshes within the pinned tag; majors (node 22 -> 26)
  # are ignored like everywhere else.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
