version: 2

# Cuatro ecosistemas, uno por manifiesto que el repo realmente tiene. Los PRs se
# agrupan para que una semana normal sea un PR por ecosistema en vez de veinte:
# cada PR extra es una corrida de CI y una revisión.
updates:
  # Backend Python. `uv` (no `pip`) porque el lockfile comprometido es uv.lock, y
  # es el que `uv sync --frozen` lee en el Dockerfile.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, python]

  # Frontend React/Vite. El package.json vive en frontend/, no en la raíz.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  # Imágenes base del Dockerfile (python:3.13-slim, node:20-slim, postgres:16-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]

  # Las actions de los workflows. Es el ecosistema que más silenciosamente se
  # queda atrás, porque nada falla cuando lo hace.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
