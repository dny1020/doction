name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A new push cancels the previous run, except on main, where each run publishes an image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Lint, types and tests run in the Dockerfile's `test` stage, which brings its own Postgres.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before the build: it compares repository files, not the image, and needs only the stdlib.
      - name: Licencia declarada de forma consistente
        run: python3 -m scripts.check_license

      # Here, not at tag time: by then the tag exists and the ruleset forbids deleting it.
      - name: La versión declarada tiene entrada en el CHANGELOG
        run: python3 -m scripts.changelog --check

      # Needs the git index, not the image: it checks links against what a clone contains.
      - name: La documentación no apunta a ficheros que no viajan
        run: python3 -m scripts.check_docs_reachable

      - name: Comments and docstrings are in English
        run: python3 -m scripts.check_comments

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          push: false
          # One cache scope per job, or each job overwrites the others' index.
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

  # Licence provenance: each commit of a human PR certifies its terms. Dependabot PRs are exempt.
  signoff:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs the PR history and its base to compute the range.
          fetch-depth: 0
      - name: Cada commit certifica sus términos
        run: python3 -m scripts.check_signoff

  # The frontend gate (`npm run check` in the `web` stage). Without this job it would only run
  # at publish time, after merging.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Strict docs build: an internal link that does not resolve fails. A job of its own because
  # mkdocs lives in the `docs` dependency group.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: El sitio se construye sin enlaces rotos
        run: uv run --group docs python -m scripts.build_docs

  # Only on push to main, after `test` and `web`: publishes the image to GHCR as the
  # pyproject.toml version and :latest, for amd64 and arm64 (the Pi).
  publish:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión de pyproject.toml
        id: version
        run: echo "value=$(awk -F'"' '/^version/{print $2}' pyproject.toml)" >> "$GITHUB_OUTPUT"

      - name: Semana ISO, para refrescar la capa de apt una vez por semana
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          # SBOM, so a pull can list what it contains; provenance mode=max also records build args,
          # which here are public repos, revisions and checksums.
          sbom: true
          provenance: mode=max
          build-args: APT_REFRESH=${{ steps.week.outputs.value }}
          # `web` is built natively in its own job with the same inputs, so its layers are
          # reused here instead of running lint, tests and the bundle a second time.
          cache-from: |
            type=gha,scope=web
            type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
