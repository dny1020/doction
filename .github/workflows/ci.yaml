name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Un push que llega mientras la corrida anterior sigue viva la cancela. En main no,
# porque ahí cada corrida publica una imagen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Lint, tipos y tests corren dentro del stage `test` del Dockerfile, que trae su
  # propio Postgres. Por eso aquí no hace falta ni Python ni base de datos: el
  # `docker build` es la prueba entera.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Antes del build y no dentro del stage `test`: el check compara ficheros del
      # repositorio, no la imagen, y ese stage tarda ~4 min con su Postgres. Meterlo ahí
      # obligaría a copiarle README, LICENSE y CONTRIBUTING, y una errata de documentación
      # volvería a correr los 293 tests para verificar una comparación de cadenas. Solo
      # usa la stdlib, así que le basta el Python del runner.
      - name: Licencia declarada de forma consistente
        run: python3 -m scripts.check_license

      # Aquí y no al crear el tag: entonces el tag ya existiría, y el ruleset de esta
      # misma ronda prohíbe borrarlo. Las notas de la release salen de este fichero.
      - name: La versión declarada tiene entrada en el CHANGELOG
        run: python3 -m scripts.changelog --check

      # Necesita el índice de git, no la imagen: compara enlaces de documentos versionados
      # contra lo que un clon contiene de verdad.
      - name: La documentación no apunta a ficheros que no viajan
        run: python3 -m scripts.check_docs_reachable

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Procedencia de licencia: cada commit de un PR certifica bajo qué términos se aporta.
  # Solo en pull_request, y por eso no se disparará en mucho tiempo: todo el historial de
  # este repositorio son pushes directos a main. Se hace antes de que haga falta porque
  # pedirle la firma al contribuidor 1 es trivial y reconstruirla desde el 20 es imposible.
  signoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Necesita la historia del PR y la base para calcular el rango.
          fetch-depth: 0
      - name: Cada commit certifica sus términos
        run: python3 -m scripts.check_signoff

  # La puerta del frontend vive en el stage `web`, que corre `npm run check`
  # (eslint + prettier + vitest + build + comprobación de assets locales). Sin este
  # job solo se ejecutaría al publicar, es decir despues de fusionar: un fallo de
  # lint del frontend tumbaria la publicacion en vez de bloquear el PR.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # El sitio de documentación se construye en estricto: un enlace interno que no resuelve
  # aborta el build. Cubre lo que check_docs_reachable no puede ver, que es la navegación
  # una vez la documentación es un sitio, y es lo que verifica el requisito de que el sitio
  # falle antes de publicar un enlace roto.
  #
  # Job aparte y no un paso del job `test`: necesita mkdocs, que vive en el grupo `docs` y
  # no se instala por defecto. Meterlo en `test` obligaría a instalar la cadena de
  # documentación antes de un build de imagen que no la usa.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: El sitio se construye sin enlaces rotos
        run: uv run --group docs python -m scripts.build_docs

  # Solo al hacer push a main, y solo si `test` y `web` pasaron: publica la imagen
  # en GHCR etiquetada con la versión de pyproject.toml y como :latest.
  # arm64 es para la Raspberry Pi; amd64, para todo lo demás.
  publish:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión de pyproject.toml
        id: version
        run: echo "value=$(awk -F'"' '/^version/{print $2}' pyproject.toml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          # Quien hace pull tiene que poder enumerar lo que se lleva y de dónde salió, sin
          # preguntarnos. El SBOM responde «¿contiene el paquete de este aviso?» sin
          # desarmar capas; Trivy corre en nuestra CI y ese resultado es nuestro, no suyo.
          #
          # La provenance ya existía: build-push-action la emite por defecto en mode=min,
          # que nombra la corrida y las imágenes base pero no los pasos ni los materiales.
          # mode=max sí, y con ello registra los build args: los ocho ARG de este
          # Dockerfile son repos, revisiones y checksums, todos ya públicos en el
          # repositorio, y la credencial del registro va a login-action y no al build.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
