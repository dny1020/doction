name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 07:00 UTC. Una dependencia no se vuelve vulnerable cuando la tocas, sino
    # cuando alguien publica el aviso, así que esto tiene que correr sin que haya push.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # Análisis estático de GitHub. Python y JavaScript se analizan por separado porque
  # CodeQL construye una base de datos por lenguaje.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # Avisos conocidos en las dependencias ya comprometidas. Es lo que Dependabot no
  # cubre: Dependabot abre PRs de actualización, esto reporta si hoy hay algo
  # vulnerable instalado.
  #
  # NO corre en pull_request, a propósito. Un aviso publicado de madrugada pondría en
  # rojo todos los PR abiertos, incluidos los que no tocan dependencias — y peor, los
  # de Dependabot que vienen precisamente a arreglarlo, que quedarían bloqueados por
  # el problema que resuelven. El gate de los PR es `dependency-review`, que solo mira
  # lo que el PR *introduce*. Esto vigila la rama y el calendario.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: pip-audit sobre el entorno bloqueado
        run: |
          uv sync --frozen --no-dev
          uv run --with pip-audit pip-audit --strict

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit del frontend
        working-directory: frontend
        # Solo `high` y arriba: en el árbol de dependencias de Vite lo moderado es casi
        # siempre una herramienta de desarrollo que no llega al bundle.
        run: npm audit --audit-level=high

  # Escaneo de la imagen que realmente se publica: capa base incluida. Es la única
  # comprobación que ve los paquetes del sistema (git, curl, tesseract).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: doction:scan
          cache-from: type=gha

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doction:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Bloquea un PR que introduce una dependencia con un aviso conocido o una licencia
  # incompatible, antes de fusionarlo. Solo tiene sentido en pull_request.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
