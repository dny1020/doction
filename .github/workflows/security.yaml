name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 07:00 UTC: advisories are published without a push.
    - cron: "0 7 * * 1"
  # The audit on demand, e.g. right after an advisory lands.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CodeQL builds one database per language.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # Known advisories in committed dependencies. Weekly only: what it finds was not introduced
  # by the triggering change, and a permanently red PR or main gets ignored.
  # PRs are gated by `dependency-review`, which only looks at what they add.
  # A finding opens (or updates) one issue labelled `security`, so it reaches a person or an
  # assigned agent instead of a red run nobody opens; a clean run closes it.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the Dockerfile's Python: unpinned, uv takes the newest release, which
      # onnxruntime ships no wheels for until weeks later.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: pip-audit sobre el entorno bloqueado
        id: pip
        run: |
          uv sync --frozen --no-dev
          set -o pipefail
          uv run --with pip-audit pip-audit --strict 2>&1 | tee pip-audit.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs even when pip-audit failed, so one report covers both ecosystems.
      - name: npm audit del frontend
        id: npm
        if: ${{ !cancelled() }}
        working-directory: frontend
        # `high` and up: moderate findings in Vite's tree are almost always dev tools.
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee ../npm-audit.txt

      - name: Open or update the audit issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PIP: ${{ steps.pip.outcome }}
          NPM: ${{ steps.npm.outcome }}
        run: |
          {
            echo "The [dependency audit]($RUN_URL) found advisories: pip-audit **$PIP**, npm audit **$NPM**."
            echo
            echo "Fix by upgrading the package in \`uv.lock\` or \`frontend/package-lock.json\`; this issue closes on the next clean audit."
            for f in pip-audit.txt npm-audit.txt; do
              if [ -s "$f" ]; then
                # shellcheck disable=SC2016 # the backticks are the markdown fence, not a command
                printf '\n<details><summary>%s</summary>\n\n```\n%s\n```\n</details>\n' "$f" "$(tail -n 60 "$f")"
              fi
            done
          } > body.md
          gh label create security --color B60205 --description "Known advisory in a dependency" 2>/dev/null || true
          n=$(gh issue list --label security --state open --search "Dependency audit in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "Dependency audit found known advisories" --label security --body-file body.md
          fi

      - name: Close the audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label security --state open --search "Dependency audit in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The weekly audit is clean again."
          done

  # Scans the published image, base layer included: the only check that sees system packages.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The same week `publish` uses, so Trivy scans the apt layer that is being shipped.
      - name: ISO week
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: doction:scan
          build-args: APT_REFRESH=${{ steps.week.outputs.value }}
          cache-from: |
            type=gha,scope=web
            type=gha,scope=publish

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doction:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Blocks a PR that adds a dependency with a known advisory or an incompatible licence.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
