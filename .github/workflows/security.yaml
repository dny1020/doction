name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 07:00 UTC. Una dependencia no se vuelve vulnerable cuando la tocas, sino
    # cuando alguien publica el aviso, así que esto tiene que correr sin que haya push.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # Análisis estático de GitHub. Python y JavaScript se analizan por separado porque
  # CodeQL construye una base de datos por lenguaje.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Avisos conocidos en las dependencias ya comprometidas. Es lo que Dependabot no
  # cubre: Dependabot abre PRs de actualización, esto reporta si hoy hay algo
  # vulnerable instalado.
  #
  # Solo en el cron semanal. Ni en pull_request ni en push, y por la misma razón en
  # los dos casos: lo que esto detecta no lo introdujo el cambio que disparó la
  # corrida. Un aviso publicado de madrugada pondría en rojo todos los PR abiertos
  # —incluidos los de Dependabot que vienen a arreglarlo, bloqueados por el problema
  # que resuelven—, y en main deja una marca roja fija hasta que exista una versión
  # parcheada que se pueda fusionar. Un workflow permanentemente rojo se ignora, que
  # es justo lo que esto quiere evitar.
  #
  # El gate de los PR es `dependency-review`, que solo mira lo que el PR *introduce*.
  # Esto vigila el calendario: una revisión semanal que falla es una señal.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: pip-audit sobre el entorno bloqueado
        run: |
          uv sync --frozen --no-dev
          uv run --with pip-audit pip-audit --strict

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit del frontend
        working-directory: frontend
        # Solo `high` y arriba: en el árbol de dependencias de Vite lo moderado es casi
        # siempre una herramienta de desarrollo que no llega al bundle.
        run: npm audit --audit-level=high

  # Escaneo de la imagen que realmente se publica: capa base incluida. Es la única
  # comprobación que ve los paquetes del sistema (git, curl, tesseract).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The same week `publish` uses, so Trivy scans the apt layer that is being shipped.
      - name: ISO week
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: doction:scan
          build-args: APT_REFRESH=${{ steps.week.outputs.value }}
          cache-from: |
            type=gha,scope=web
            type=gha,scope=publish

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doction:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Bloquea un PR que introduce una dependencia con un aviso conocido o una licencia
  # incompatible, antes de fusionarlo. Solo tiene sentido en pull_request.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
