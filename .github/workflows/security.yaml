name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 07:00 UTC: advisories are published without a push.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # CodeQL builds one database per language.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Known advisories in committed dependencies. Weekly only: what it finds was not introduced
  # by the triggering change, and a permanently red PR or main gets ignored.
  # PRs are gated by `dependency-review`, which only looks at what they add.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: pip-audit sobre el entorno bloqueado
        run: |
          uv sync --frozen --no-dev
          uv run --with pip-audit pip-audit --strict

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit del frontend
        working-directory: frontend
        # `high` and up: moderate findings in Vite's tree are almost always dev tools.
        run: npm audit --audit-level=high

  # Scans the published image, base layer included: the only check that sees system packages.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The same week `publish` uses, so Trivy scans the apt layer that is being shipped.
      - name: ISO week
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: doction:scan
          build-args: APT_REFRESH=${{ steps.week.outputs.value }}
          cache-from: |
            type=gha,scope=web
            type=gha,scope=publish

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doction:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Blocks a PR that adds a dependency with a known advisory or an incompatible licence.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
