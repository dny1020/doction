name: Scorecard

# OpenSSF Scorecard: supply-chain posture (pinned actions, token permissions, branch
# protection). Default branch only; its findings land in the same code-scanning queue as
# CodeQL and Trivy, under the policy in SECURITY.md.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Mondays 07:30 UTC, after the security scan.
    - cron: "30 7 * * 1"

permissions: read-all

jobs:
  # `publish_results` requires the job to hold only these steps: no env, no run steps.
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
