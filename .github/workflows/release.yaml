name: Release

# Version tags only: the pattern needs three numbers, so a stray tag like `rm` is ignored.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Only creates the release; the image was published when the version merged to main.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Notes come from CHANGELOG.md; the gate already checked the version has an entry.
      - name: Extraer las notas del CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 -m scripts.changelog "$version" > release-notes.md
          echo "--- notas de $version ---"
          cat release-notes.md

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "doction ${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
