name: Docs site

# Publishes https://doction.site from main when the docs or their build change.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - "scripts/docs_hooks.py"
      - "app/static/vendor/fonts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "DESIGN.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

# `pages: write` to publish, `id-token: write` for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancelling one halfway leaves a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Same strict build as `make docs`, so a broken link fails here too.
      - name: Construir el sitio
        run: uv run --group docs python -m scripts.build_docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
