# The Spanish site, served under /es/. Everything not overridden here comes from mkdocs.yml.
# Build only through scripts/build_docs.py, which stages docs/es/ as this tree's docs/.
INHERIT: mkdocs.yml

site_description: Una base de conocimiento autoalojada, markdown primero, para personas y agentes de código
site_url: https://doction.site/es/
docs_dir: build/docs-es
site_dir: site/es

theme:
  language: es
  # Lists are replaced, not merged, so the palette is repeated for the Spanish labels.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Cambiar a modo claro

# Repository documents are English only; the links are absolute and check_site() verifies each
# one resolves in the English site.
nav:
  - Inicio: docs/index.md
  - Primeros pasos:
      - Introducción (en inglés): https://doction.site/introduction/
      - docs/install.md
      - docs/configuration.md
  - Usar doction:
      - docs/writing-pages.md
      - docs/linking.md
      - docs/tags-and-metadata.md
      - docs/search.md
      - docs/graph.md
  - Desarrollo:
      - docs/api.md
      - docs/mcp.md
      - docs/architecture.md
  - Operación:
      - docs/operations.md
      - docs/troubleshooting.md
  - Proyecto (en inglés):
      - Contribuir: https://doction.site/CONTRIBUTING/
      - Seguridad: https://doction.site/SECURITY/
      - Diseño: https://doction.site/DESIGN/
      - Cambios: https://doction.site/CHANGELOG/
      - Código de conducta: https://doction.site/CODE_OF_CONDUCT/
