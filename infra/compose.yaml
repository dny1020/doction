services:
  postgres:
    image: postgres:16-alpine
    container_name: doction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: doction
    volumes:
      - /mnt/ssd/doction/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doction"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net

  doction:
    image: ghcr.io/dny1020/doction:latest
    container_name: doction
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://doction:${POSTGRES_PASSWORD}@postgres:5432/doction
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # La imagen corre como uid 1000 (non-root). Una única vez, si los datos
      # vienen de deploys antiguos (root):
      #   sudo chown -R 1000:1000 /mnt/ssd/doction/{pages,uploads,logs}
      # (postgres/ NO: es del contenedor de Postgres.)
      - /mnt/ssd/doction:/data
      - /mnt/ssd/doction/logs:/logs
    networks:
      - proxy_net
      - db_net
    # Tope de RAM: en la Pi conviven app y Postgres; si onnxruntime se dispara,
    # que el kernel mate solo al app (restart lo levanta) y Postgres sobreviva.
    mem_limit: 768m
    # Un contenedor colgado (no caído) también cuenta como no-sano; el healthcheck
    # lo hace visible en `docker ps` y para el deploy.sh.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy_net:
    external: true
  db_net:
