[project]
name = "doction"
version = "0.31.11"
description = "Minimalist, markdown-first DevOps knowledge system"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",  # uploads (Form/File)
    "PyJWT>=2.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Local semantic search, opt-in via SEMANTIC_SEARCH; the ONNX model ships in the
    # image. numpy arrives with onnxruntime.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",  # lo necesita el TestClient de starlette
    "ruff>=0.8",
    "pyright>=1.1.411",
]
# Separate from dev on purpose: the Docker `test` stage runs `uv sync --frozen`, which installs
# dev, so a documentation toolchain there would be installed on every CI test build for nothing.
# Get it with `uv sync --group docs`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
package = false

# ruff and pyright take the Python version from requires-python.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ARG flags arguments that are accepted and ignored: that is how 17 `user_id` parameters
# that filtered nothing but looked like access control got in. Where the framework fixes
# the signature, the argument gets a leading underscore, which ruff does not flag.
select = ["E", "F", "I", "UP", "B", "ARG"]

[tool.ruff.lint.per-file-ignores]
# In tests ARG is only noise: monkeypatch doubles have to match a signature they do not
# use, and a fixture requested for its side effect cannot be renamed — pytest resolves
# them by name.
"tests/**" = ["ARG"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these as parameter defaults; it is its normal pattern.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pyright]
include = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
# Without this, a bare `pytest` walks into data/ — the unreadable Postgres datadir —
# and dies during collection.
testpaths = ["tests"]
