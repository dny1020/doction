[project]
name = "doction"
version = "0.18.1"
description = "Minimalist, markdown-first DevOps knowledge system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",  # uploads (Form/File)
    "PyJWT>=2.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Búsqueda semántica local, opt-in con SEMANTIC_SEARCH: el modelo ONNX viaja en
    # la imagen, sin servicios externos. numpy llega de la mano de onnxruntime.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",  # lo necesita el TestClient de starlette
    "ruff>=0.8",
    "pyright>=1.1.411",
]

[tool.uv]
package = false

# ruff y pyright deducen la versión de Python desde requires-python.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI las usa como valores por defecto de parámetros; es su patrón normal.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pyright]
include = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
# Sin esto, `pytest` a secas intenta recorrer data/ (el datadir de Postgres, que no
# es legible) y revienta al recolectar.
testpaths = ["tests"]
