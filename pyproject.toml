[project]
name = "doction"
version = "0.33.0"
description = "Minimalist, markdown-first DevOps knowledge system"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",  # uploads (Form/File)
    "PyJWT>=2.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Opt-in semantic search (SEMANTIC_SEARCH); the ONNX model ships in the image.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",  # needed by starlette's TestClient
    "ruff>=0.8",
    "pyright>=1.1.411",
]
# Separate from dev: the Docker `test` stage installs dev. Get it with `uv sync --group docs`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
package = false

# ruff and pyright take the Python version from requires-python.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ARG flags accepted-but-ignored arguments; where the framework fixes the signature, prefix
# the argument with an underscore.
select = ["E", "F", "I", "UP", "B", "ARG"]

[tool.ruff.lint.per-file-ignores]
# In tests ARG is noise: monkeypatch doubles and side-effect fixtures must keep their names.
"tests/**" = ["ARG"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these as parameter defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pyright]
include = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
# Without this a bare `pytest` walks into data/, the unreadable Postgres datadir.
testpaths = ["tests"]
