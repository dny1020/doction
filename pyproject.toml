[project]
name = "doction"
version = "0.18.0"
description = "Minimalist, markdown-first DevOps knowledge system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "PyJWT>=2.8",
    "python-multipart>=0.0.18",
    # Búsqueda semántica local (opt-in vía SEMANTIC_SEARCH): modelo ONNX en el
    # contenedor, sin servicios externos. numpy entra de la mano de onnxruntime.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=2.1.0",
    "black>=26.5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa estos como valores por defecto de parámetros (patrón estándar).
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.black]
line-length = 100  # igual que ruff, para que no se pisen
target-version = ["py313"]  # igual que ruff; sin esto black asume hasta 3.15 y avisa

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
# Sin stubs publicados; el runtime funciona igual.
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
# `pytest` a secas solo recolecta tests/ — sin esto intenta caminar data/
# (datadir de Postgres, ilegible para el usuario) y revienta la recolección.
testpaths = ["tests"]
